name: Generate Snake Animation

on:
  schedule:
    # Runs at 12am UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    # allow this job to write repository contents (needed to push generated files)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Check out the repository
      - name: Checkout
        uses: actions/checkout@v4

      # Generate the snake animation
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Nabilaahmed2000
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # Push the generated files to the output branch
      - name: Push snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
          # explicitly pass the token to the action
          github_token: ${{ secrets.GITHUB_TOKEN }}
